spring.application.name=Jcheckpoint

# Map the local save directory using an environment variable
# ${...} sintax to search external values
# CHECKPOINT_SAVE_PATH: "key" name that springs will looking for
checkpoint.path.local=${CHECKPOINT_SAVE_PATH}

# path where trimui will mount
checkpoint.path.external=/home/daniel/mnt/trimui/saves

# trimui config
app.storage.type=sftp
app.trimui.ip=192.168.0.107
app.trimui.user=trimui
app.trimui.password=trimui
app.trimui.save-path=/SDCARD/RetroArch/.retroarch/saves/
app.trimui.save-extensions=.srm,.sav,.state,.mcr,.rtc